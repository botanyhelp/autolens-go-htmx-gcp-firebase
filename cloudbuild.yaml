steps:
  # 1. Build Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/autolens-go:$COMMIT_SHA', '.']

  # 2. Push image to Google Container / Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/autolens-go:$COMMIT_SHA']

  # 3. Deploy container directly to Google Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'autolens-go'
      - '--image'
      - 'gcr.io/$PROJECT_ID/autolens-go:$COMMIT_SHA'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--set-env-vars'
      - 'GOOGLE_CLOUD_PROJECT=$PROJECT_ID,GCS_VIDEO_BUCKET=autolens-records-$PROJECT_ID'

images:
  - 'gcr.io/$PROJECT_ID/autolens-go:$COMMIT_SHA'
