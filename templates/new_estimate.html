{{define "content"}}
<div class="card" style="max-width: 760px; margin: 0 auto;">
  <div style="margin-bottom: 20px;">
    <h2 style="font-size: 1.25rem; font-weight: 700;">Create Car Repair Estimate Record</h2>
    <p style="color: var(--text-muted); font-size: 0.85rem;">
      Step 1 of 2: Enter customer & repair line items. Step 2 will record/attach the walkaround video.
    </p>
  </div>

  <form method="POST" action="/estimates/create">
    
    <div style="font-weight: 700; font-size: 0.9rem; color: #60a5fa; margin-bottom: 12px; border-bottom: 1px solid var(--surface-border); padding-bottom: 6px;">
      Customer Contact Details
    </div>
    
    <div class="grid-2">
      <div class="form-group">
        <label>Customer Full Name *</label>
        <input type="text" name="customer_name" required placeholder="e.g. Marcus Vance">
      </div>
      <div class="form-group">
        <label>Phone Number *</label>
        <input type="tel" name="phone" required placeholder="(555) 389-2041">
      </div>
    </div>

    <div class="form-group">
      <label>Email Address</label>
      <input type="email" name="email" placeholder="customer@example.com">
    </div>

    <div style="font-weight: 700; font-size: 0.9rem; color: #60a5fa; margin: 20px 0 12px 0; border-bottom: 1px solid var(--surface-border); padding-bottom: 6px;">
      Vehicle Specifications
    </div>

    <div class="grid-2">
      <div class="form-group">
        <label>Year</label>
        <input type="number" name="vehicle_year" value="2022" required>
      </div>
      <div class="form-group">
        <label>Make</label>
        <input type="text" name="vehicle_make" value="Toyota" required>
      </div>
    </div>

    <div class="grid-2">
      <div class="form-group">
        <label>Model</label>
        <input type="text" name="vehicle_model" value="RAV4" required>
      </div>
      <div class="form-group">
        <label>License Plate</label>
        <input type="text" name="license_plate" placeholder="7XYZ892">
      </div>
    </div>

    <div style="font-weight: 700; font-size: 0.9rem; color: #60a5fa; margin: 20px 0 12px 0; border-bottom: 1px solid var(--surface-border); padding-bottom: 6px;">
      Initial Parts & Labor Estimate
    </div>

    <div class="grid-2">
      <div class="form-group">
        <label>Primary Part Description</label>
        <input type="text" name="part_name" value="Front Ceramic Brake Pads & Rotors" required>
      </div>
      <div class="form-group">
        <label>Parts Total ($) *</label>
        <input type="number" step="0.01" name="parts_cost" value="292.50" required>
      </div>
    </div>

    <div class="grid-2">
      <div class="form-group">
        <label>Labor Description</label>
        <input type="text" name="labor_desc" value="Remove & Replace Front Pads & Rotors" required>
      </div>
      <div class="form-group">
        <label>Labor Total ($) *</label>
        <input type="number" step="0.01" name="labor_cost" value="261.00" required>
      </div>
    </div>

    <div class="form-group">
      <label>Mechanic Diagnostic Notes</label>
      <textarea name="notes" rows="3" placeholder="Explain what was inspected on the lift and why repairs are needed...">Front friction pads worn to 1.8mm (below legal safety limit). Rotor surfaces show heat scoring.</textarea>
    </div>

    <div class="form-group">
      <label>Priority / Urgency</label>
      <select name="urgency">
        <option value="safety_critical">Immediate Safety Critical</option>
        <option value="recommended_soon">Recommended Soon</option>
        <option value="maintenance">Routine Scheduled Maintenance</option>
      </select>
    </div>

    <div style="margin-top: 24px; display: flex; justify-content: flex-end; gap: 12px;">
      <a href="/" class="btn btn-outline">Cancel</a>
      <button type="submit" class="btn btn-success">Save Record & Proceed to Video &rarr;</button>
    </div>
  </form>
</div>
{{end}}
